# Wavemix mic effects chain.
#
# A PipeWire filter-chain node that captures the microphone and exposes a
# processed source ("Wavemix Mic FX"). Wavemix routes the mic through it when
# the mic FX is enabled; the node itself is always present.
#
# Adding more plugins later means editing filter.graph below and restarting
# PipeWire (systemctl --user restart pipewire pipewire-pulse wireplumber).

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Wavemix Mic FX"
      media.name = "Wavemix Mic FX"
      filter.graph = {
        nodes = [
          {
            type = ladspa
            name = rnnoise
            plugin = /usr/lib/ladspa/librnnoise_ladspa.so
            label = noise_suppressor_mono
            control = {
              "VAD Threshold (%)" = 50.0
              "VAD Grace Period (ms)" = 200
              "Retroactive VAD Grace (ms)" = 0
            }
          }
        ]
      }
      capture.props = {
        node.name = "wavemix_micfx.capture"
        node.autoconnect = false
        node.passive = true
      }
      playback.props = {
        node.name = "wavemix_micfx"
        node.target = "wavemix_micbus"
        node.passive = true
      }
    }
  }
]
